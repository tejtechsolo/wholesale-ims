# Local Supabase stack (`supabase start`) used by E2E tests in CI.
# Migrations in supabase/migrations are applied automatically; seeding is done by
# e2e/global-setup.ts (users via the Auth admin API, data via supabase/seed.test.sql).
project_id = "wholesale-ims"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
# Invite-only: accounts are created by an admin (see CLAUDE.md).
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
