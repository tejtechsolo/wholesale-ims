# Local Supabase stack (`supabase start`) used by E2E tests in CI.
# Migrations in supabase/migrations are applied automatically; seeding is done by
# e2e/global-setup.ts (users via the Auth admin API, data via supabase/seed.test.sql).
project_id = "wholesale-ims"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
# Invite-only: accounts are created by an admin (see CLAUDE.md).
enable_signup = false

[auth.email]
# NOTE: in the Supabase CLI this flag turns the whole email provider on/off. With it false,
# GoTrue rejects even password sign-in ("email_provider_disabled", seen in CI). Public
# sign-up stays off via [auth] enable_signup = false (asserted in e2e/auth.spec.ts).
enable_signup = true
enable_confirmations = false
# Local/CI only: E2E sends an invite and then a reset to the same address within seconds.
max_frequency = "1s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
# Local/CI only (hosted default is much lower; keep it low in production).
email_sent = 100

[inbucket]
# Local mail catcher (Mailpit); E2E reads invite/reset links from it.
enabled = true
port = 54324

# Emails link to /auth/confirm with a token_hash (server-side verifyOtp). Hosted project:
# paste the same templates under Authentication → Email Templates.
[auth.email.template.invite]
subject = "You're invited to Wholesale IMS"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Wholesale IMS password"
content_path = "./supabase/templates/recovery.html"
